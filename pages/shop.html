<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3legant-shop</title>
    <link rel="stylesheet" href="../src/output.css">
</head>

<body>

    <header class="py-4.5 bg-[#FFC95C] z-50 fixed top-0 right-0 left-0 text-[#141718]">

        <div class="header-section container flex justify-between items-center">

            <div class="menu max-md:block hidden">
                <img src="../icons/menu.png" alt="menu-icon">
            </div>

            <div class="project-name">
                <h2 class="text-[24px] font-bold">3legant.</h2>
            </div>

            <div class="list max-md:hidden block">
                <ul class="flex gap-10">
                    <li><a href="../index.html"
                            class="opacity-50 inline-block hover:opacity-100 transition-all duration-300 hover:scale-[90%]">Home</a>
                    </li>
                    <li>
                        <a href="#"
                            class="opacity-100 inline-block transition-all duration-300 hover:scale-[90%]">Shop</a>
                    </li>
                    <li>
                        <a href="#"
                            class="opacity-50 inline-block hover:opacity-100 transition-all duration-300 hover:scale-[90%]">Product</a>
                    </li>
                    <li>
                        <a href="#"
                            class="opacity-50 inline-block hover:opacity-100 transition-all duration-300 hover:scale-[90%]">ContactUs</a>
                    </li>
                </ul>
            </div>
            <div class="icons">
                <ul class="flex gap-4">
                    <li><a href="#"><img src="../icons/search.png" class="max-md:hidden block" alt="search"></a></li>
                    <li><a href="#"><img src="../icons/Vector.png" class="max-md:hidden block" alt="Vector"></a></li>
                    <li><a href="#"><img src="../icons/shopping bag.png" alt="shopping bag"></a></li>
                </ul>
            </div>
        </div>

    </header>

    <main>

        <section class="hero bg-[#FFC95C] pt-32">

            <div class="hero-section container flex flex-col md:flex-row items-center justify-center gap-6">
                <div class="hero-img max-md:order-2">
                    <img src="../imgs/hero-shop.png" class="w-full h-auto md:h-[calc(100vh-128px)] object-contain" alt="person with headphone">
                </div>
                <div class="hero-info max-md:text-center">
                    <h1 class="text-[#121212] text-[40px] xs:text-[60px] md:text-[50px] smd:text-[60px] xmd:text-[65px] lg:text-[80px] leading-12 xs:leading-21 md:leading-15 smd:leading-16 xmd:leading-18 lg:leading-21 font-semibold">Listen to<br>the <span class="text-[#377DFF]">amazing<br></span><span class="whitespace-nowrap">music sound.</span></h1>
                    <p class="text-[#121212] text-[20px] leading-8 pt-2 pb-7">Experience music like never before</p>
                    <button class="text-white text-[18px] leading-8 rounded-lg bg-[#141718] px-16 py-3 hover:opacity-70 transition-all duration-300 cursor-pointer"><a href="#" class="">Shopping Now</a></button>
                </div>
            </div>

        </section>

    </main>

</body>

</html>

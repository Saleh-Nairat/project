<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3legant-collection</title>
    <link rel="stylesheet" href="../src/output.css">
</head>

<body>

    <header class="py-4.5 bg-[#FFC95C] z-50 fixed top-0 right-0 left-0 text-[#141718]">

        <div class="header-section container flex justify-between items-center">

            <div class="menu max-md:block hidden">
                <img src="../icons/menu.png" alt="menu-icon">
            </div>

            <div class="project-name">
                <h2 class="text-[24px] font-bold">3legant.</h2>
            </div>

            <div class="list max-md:hidden block">

                <ul class="flex gap-10">

                    <li><a href="#"
                            class="opacity-100 inline-block transition-all duration-300 hover:scale-[90%]">Home</a>
                    </li>
                    <li><a href="#"
                            class="opacity-50 inline-block hover:opacity-100 transition-all duration-300 hover:scale-[90%]">Shop</a>
                    </li>
                    <li><a href="#"
                            class="opacity-50 inline-block hover:opacity-100 transition-all duration-300 hover:scale-[90%]">Product</a>
                    </li>
                    <li><a href="#"
                            class="opacity-50 inline-block hover:opacity-100 transition-all duration-300 hover:scale-[90%]">Contact
                            Us</a></li>
                </ul>
            </div>
            <div class="icons">
                <ul class="flex gap-4">
                    <li><a href="#"><img src="../icons/search.png" class="max-md:hidden block" alt="search"></a></li>
                    <li><a href="#"><img src="../icons/Vector.png" class="max-md:hidden block" alt="Vector"></a></li>
                    <li><a href="#"><img src="../icons/shopping bag.png" alt="shopping bag"></a></li>
                </ul>
            </div>
        </div>

    </header>

    <main>

        <section class="hero bg-[#FFC95C] pt-15 h-screen">

            <div class="hero-section w-[75%] mx-auto h-full grid grid-cols-1 lg:grid-cols-2">
                <div
                    class="hero bg-[url('../imgs/collection-hero.png')] h-full bg-cover bg-no-repeat">
                </div>
                <div class="flex flex-col justify-center items-start">
                    <h1 class="text-[#121212] text-[50px] lg:text-[65px] xl:text-[80px] leading-15 lg:leading-17 xl:leading-21 font-semibold">Listen to <br>the <span class="text-[#377DFF]">amazing</span> music sound.</h1>
                    <p class="text-black/90 text-[20px] leading-8 pt-2 pb-7">Experience music like never before</p>
                    <button class="cursor-pointer hover:opacity-70 transition duration-300 whitespace-nowrap rounded-lg 
                    text-[18px] bg-black text-white leading-8 px-17 py-3">Shopping Now</button>
                </div>
            </div>

        </section>

    </main>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3legant-Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../src/output.css">
</head>

<body>

    <header class="py-4.5 bg-white z-50 fixed top-0 right-0 left-0">

        <div class="header-section container flex justify-between items-center">

            <div class="menu max-md:block hidden">
                <img src="../icons/menu.png" alt="menu-icon">
            </div>

            <div class="project-name">
                <h2 class="text-[24px] font-bold">3legant.</h2>
            </div>

            <div class="list max-md:hidden block">

                <ul class="flex gap-10">

                    <li><a href="../index.html"
                            class="inline-block hover:text-blue-600 transition-all duration-300 hover:scale-[90%]">Home</a>
                    </li>
                    <li><a href="./shop.html"
                            class="opacity-40 inline-block hover:text-blue-600 transition-all duration-300 hover:scale-[90%]">Shop</a>
                    </li>
                    <li><a href="./product.html"
                            class="opacity-40 inline-block hover:text-blue-600 transition-all duration-300 hover:scale-[90%]">Product</a>
                    </li>
                    <li><a href="./contact-us.html"
                            class="opacity-40 inline-block hover:text-blue-600 transition-all duration-300 hover:scale-[90%]">Contact
                            Us</a></li>
                </ul>
            </div>
            <div class="icons">
                <ul class="flex gap-4">
                    <li><a href="#"><img src="../icons/search.png" class="max-md:hidden block" alt="search"></a></li>
                    <li><a href="#"><img src="../icons/Vector.png" class="max-md:hidden block" alt="Vector"></a></li>
                    <li><a href="#"><img src="../icons/shopping bag.png" alt="shopping bag"></a></li>
                </ul>
            </div>
        </div>

    </header>

    <main>

        <section class="hero-section container h-137.5">

            <div
                class="hero flex flex-col gap-6 justify-center items-center bg-[url('../imgs/blog-hero.png')] w-full h-full bg-cover bg-center bg-no-repeat">
                <ul class="flex min-[0px]:max-[344px]:gap-2.5 gap-4">
                    <li><a href="../index.html"
                            class="flex gap-1 items-center text-[#605F5F] text-[14px] xs:text-[16px] leading-6 opacity-90 hover:text-blue-500 cursor-pointer transition-all duration-300">Home<span><img
                                    src="../icons/product-chevron-right.svg" alt="arraow-right"></span></a></li>
                    <li><a href="#"
                            class="flex items-center text-black/900 text-[14px] xs:text-[16px] leading-6 hover:text-blue-500 cursor-pointer transition-all duration-300">Blog
                        </a>
                    </li>
                </ul>
                <h1 class="text-[#000000] text-[42px] xs:text-[48px] sm:text-[54px] leading-14 font-medium py-1">Our Blog</h1>
                <p class="text-[#121212] text-[14px] xs:text-[16px] sm:text-[20px] leading-8">Home ideas and design inspiration</p>
            </div>

        </section>

        <section class="blogs container pt-6">

            <div class="blogs-header flex flex-col sm:flex-row justify-between items-center max-sm:gap-8">
                <ul class="flex gap-10">
                    <li class="text-[#121212] text-[14px] leading-5 font-semibold underline underline-offset-[5.5px] decoration-[1.5px] hover:cursor-pointer hover:text-blue-500 transition-all duration-300">All Blog</li>
                    <li class="text-[#807E7E] text-[14px] leading-5 font-semibold hover:cursor-pointer hover:text-blue-500 transition-all duration-300">Featured</li>
                </ul>
                <div class="blogs-sort-by flex gap-8 items-center">
                    <select name="sort-by" id="" class="text-[#121212] text-[16px] font-semibold">
                        <option value="1">Sort by</option>
                        <option value="2">Newest</option>
                        <option value="3">Oldest</option>
                    </select>
                    <ul class="flex items-center">
                        <li class="hover:cursor-pointer hover:opacity-70 transition-all duration-300"><img src="../icons/blog-sort-by1.svg" alt="sort by"></li>
                        <li class="hover:cursor-pointer hover:opacity-70 transition-all duration-300"><img src="../icons/blog-sort-by2.svg" alt="sort by"></li>
                        <li class="hover:cursor-pointer hover:opacity-70 transition-all duration-300"><img src="../icons/blog-sort-by3.svg" alt="sort by"></li>
                        <li class="hover:cursor-pointer hover:opacity-70 transition-all duration-300"><img src="../icons/blog-sort-by4.svg" alt="sort by"></li>
                    </ul>
                </div>
            </div>

        </section>

    </main>

</body>

</html>

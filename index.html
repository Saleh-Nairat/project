<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/output.css">
</head>
<body>

    <header class="container flex justify-between py-4.5 bg-white z-50 fixed top-0 right-0 left-0">

        <div class="menu max-md:block hidden">
            <img src="./icons/menu.png" alt="menu-icon">
        </div>

        <div class="project-name">
            <h2 class="text-[24px] font-bold">3legant.</h2>
        </div>

        <div class="list max-md:hidden block">
            
            <ul class="flex gap-10">

                <li><a href="#" class="inline-block hover:text-blue-600 transition-all duration-300 hover:scale-[90%]">Home</a></li>
                <li><a href="#" class="opacity-40 inline-block hover:text-blue-600 transition-all duration-300 hover:scale-[90%]">Shop</a></li>
                <li><a href="#" class="opacity-40 inline-block hover:text-blue-600 transition-all duration-300 hover:scale-[90%]">Product</a></li>
                <li><a href="#" class="opacity-40 inline-block hover:text-blue-600 transition-all duration-300 hover:scale-[90%]">Contact Us</a></li>
                
            </ul>

        </div>

        <div class="icons">

            <ul class="flex gap-4">

                <li><a href="#"><img src="./icons/search.png" class="max-md:hidden block" alt="search"></a></li>
                <li><a href="#"><img src="./icons/Vector.png" class="max-md:hidden block" alt="Vector"></a></li>
                <li><a href="#"><img src="./icons/shopping bag.png" alt="shopping bag"></a></li>

            </ul>

        </div>

    </header>

    <main>

        <section class="hero-section">

            <div class="flex justify-between items-center container hero bg-[url(/imgs/hero.png)] h-screen bg-cover bg-no-repeat">
                <img src="./icons/arraow-left.png" class="hover:opacity-40 transition duration-300"  alt="arraow-left">
                <img src="./icons/arraow-right.png" class="hover:opacity-40 transition duration-300" alt="arraow-right">
            </div>
            
        </section>

        <section class="container flex max-md:flex-col justify-between mt-8 mb-10 items-center gap-8">
            
            <div class="title max-md:w-full w-[50%] max-md:mb-10 max-md:text-center">
                <span class="text-black text-[72px] font-medium leading-18 tracking-[-2px] max-md:text-[48px]">Simply Unique</span>
                <span class="text-black text-[72px] font-medium leading-18 tracking-[-2px] max-md:text-[48px]">Simply Better.</span>
            </div>
            
            <div class="info flex gap-0.5 justify-end max-md:w-full w-[50%] max-md:text-center">
                <p class="text-gray-500"><span class="text-[16px] font-medium text-black">3legant</span> is a gift & decorations store based in HCMC, Vietnam. Est since 2019. </p>
            </div>

        </section>

        <section class="container products grid grid-cols-2 gap-6 grid-rows-2 max-sm:grid-cols-1">
            
            <div class="product row-span-2 relative">
                <div class="details absolute top-[8%] left-[8%]">
                    <h3 class="max-md:mb-2 lg:mb-3 text-[20px] lg:text-[34px] sm:text-[24px] md:text-[28px] font-[450]">Living Room</h3>
                    <div class="flex w-fit gap-1 items-center border-b border-black">
                        <a href="#" class="max-lg:text-[12px] text-[16px]">Shop Now</a>
                        <img src="./icons/arrow-right-small.png" alt="arrow right">
                    </div>
                </div>
                <img src="./imgs/living-room-sofa.png" class="w-full" alt="sofa">
            </div>

            <div class="product relative">
                <div class="details absolute top-[8%] left-[8%]">
                    <h3 class="max-md:mb-2 lg:mb-3 text-[20px] lg:text-[34px] sm:text-[24px] md:text-[28px] font-[450]">Bedroom</h3>
                    <div class="flex w-fit gap-1 items-center border-b border-black">
                        <a href="#" class="max-lg:text-[12px] text-[16px]">Shop Now</a>
                        <img src="./icons/arrow-right-small.png" alt="arrow right">
                    </div>
                </div>
                <img src="./imgs/beedroom-table.png" class="w-full" alt="beedroom-table">
            </div>

            <div class="product relative">
                <div class="details absolute top-[8%] left-[8%]">
                    <h3 class="max-md:mb-2 lg:mb-3 text-[20px] lg:text-[34px] sm:text-[24px] md:text-[28px] font-[450]">Kitchen</h3>
                    <div class="flex w-fit gap-1 items-center border-b border-black">
                        <a href="#" class="max-lg:text-[12px] text-[16px]">Shop Now</a>
                        <img src="./icons/arrow-right-small.png" alt="arrow right">
                    </div>
                </div>
                <img src="./imgs/tostar.png" class="w-full" alt="tostar">
            </div>

        </section>

    </main>

</body>
</html>
